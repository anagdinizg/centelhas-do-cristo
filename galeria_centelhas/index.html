<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recordações Centelhas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="galeria-section">
    <div class="galeria-container">
      
        <h1 class="galeria-titulo">Recordações Centelhas</h1>

        <div class="galeria">
        <div class="card-foto">
            <img src="assets/equipeCentelhas.jpg" alt="Equipe Centelhas" />
            <p class="descricao">Equipe Centelhas</p>
        </div>
        <div class="card-foto">
            <img src="assets/trabalho-emequipe1.jpg" alt="Montagem em equipe" />
            <p class="descricao"> Trabalho em equipe </p>
        </div>
        <div class="card-foto">
            <img src="assets/trabalho-emequipe.jpg" alt="Montagem marmitas" />
            <p class="descricao">Montagem das marmitas</p>
        </div>
        <div class="card-foto">
            <img src="assets/guardando_marmitas.jpg" alt="Armazenamento" />
            <p class="descricao">Organizando marmitas para distribuição</p>
        </div>
        <div class="card-foto">
            <img src="assets/marmita-do-dia.jpg" alt="Marmita do dia" />
            <p class="descricao">Marmita do dia</p>
        </div>
        <div class="card-foto">
            <img src="assets/atual-espaço-doCentelhas.jpg" alt="Equipe atual" />
            <p class="descricao">Espaço atual da equipe</p>
        </div>
        </div>
    </div>
  </section>
</body>
</html>
